# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = [
    "crates/thunderbird-tray",
    "crates/thunderbird-tray-native-messaging",
    "crates/thunderbird-tray-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
image = { version = "0.25.9", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
slint = { version = "=1.13.1", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
zbus = { version = "=5.13.2", default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.14.0", default-features = false }

[profile.release]
strip = "symbols"
