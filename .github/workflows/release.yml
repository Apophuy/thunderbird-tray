name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build and verify reproducible release artifacts
        run: ./scripts/test-release-reproducibility.sh
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-tray-linux
          path: dist/release/*
          compression-level: 0
          if-no-files-found: error
      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            const root = JSON.parse(input).packages.find(item => item.name === "thunderbird-tray");
            process.stdout.write(root.version);
          });
          ')
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes
